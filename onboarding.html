<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Onboarding page for Vita Track" />
    <title>Onboarding Page</title>
    <link rel="stylesheet" href="onboarding.css" />
    <link rel="stylesheet" href="responsive.css" />
    <!-- Helps the browser connect to Google Fonts faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- logo section -->
    <section>
      <div class="logo">
        <img src="logo.png" alt="company logo" />
        <h4>Hospital Billing and Collections</h4>
      </div>
    </section>

    <!--body text section -->
    <section>
      <div class="body-text">
        <h3>Smarter billings. Stronger revenue</h3>
        <h5 style="color: grey">
          Vita Track helps hospitals track, manage and resolve claims
          efficiently<br />
          so your teams can focus on what matters delivering quality care.
        </h5>
      </div>
    </section>

    <!--button section-->
    <section>
      <div class="sign-up btn">
        <a href="login.html"><button>Sign in</button></a>
      </div>

      <div class="create-acc btn">
        <a href="signup.html"><button>Create an Account →</button></a>
      </div>
    </section>
    <script src="onboarding.js"></script>
  </body>
</html>
