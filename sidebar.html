<style>
:root{
  --sidebar-bg:#0B1727;
  --accent:#4240E3;
  --accent-hover:#3532c4;
  --white:#FBFBFD;
  --page-bg:#F1F3F8;
  --text-dark:#1E293B;
  --stroke:#748071;
  --stroke-light:#E3E4E8;
  --placeholder:#828078;
  --overdue-bg:#EAC1C1;
  --overdue-text:#E43E52;
  --paid-bg:#CDEFDD;
  --paid-text:#21AF72;
  --pending-bg:#FBE7C6;
  --pending-text:#B8720A;
  --thead-bg:#ECECF5;
  --green:#21AF72;
  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:10px;
  --sidebar-w:239px;
  --topbar-h:67px;
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans', system-ui, sans-serif;
  background:var(--page-bg);
  color:var(--text-dark);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
select,input{font-family:inherit;}
svg{display:block;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

.app{
  display:flex;
  min-height:100vh;
}

/* ================= Sidebar ================= */
.sidebar{
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  background:var(--sidebar-bg);
  color:var(--white);
  display:flex;
  flex-direction:column;
  padding:14px 12px 20px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.brand{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  padding:0 3px;
  margin-bottom:24px;
}
.brand-svg{flex:none; width:139px; height:40px;}
.brand-sub{
  font-weight:400;
  font-size:10px;
  line-height:13px;
  color:var(--white);
  opacity:.75;
  max-width:160px;
  padding-left:2px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:22px;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:10px 8px;
  background:transparent;
  border:1px solid var(--accent);
  border-radius:10px;
  color:var(--white);
  font-size:13px;
  font-weight:600;
  text-align:left;
  text-decoration:none;
  cursor:pointer;
  box-sizing:border-box;
  transition:background .15s ease;
}
.nav-item:hover{background:rgba(66,64,227,.18);}
.nav-item.active{background:var(--accent); border-color:var(--accent);}
.nav-icon{width:24px;height:24px;flex:none;color:var(--white);}

.nav-svg-btn{
  display:block;
  width:100%;
  padding:0;
  margin:0;
  border:none;
  background:transparent;
  border-radius:10px;
  overflow:hidden;
  line-height:0;
  cursor:pointer;
  transition:filter .15s ease, transform .1s ease;
}
.nav-svg-btn svg{display:block; width:100%; height:auto;}
.nav-svg-btn:hover{filter:brightness(1.18);}
.nav-svg-btn.active:hover{filter:brightness(1.08);}
.nav-svg-btn:active{transform:scale(0.99);}

.user-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 4px;
  border-top:1px solid var(--stroke);
  border-bottom:1px solid var(--stroke);
  margin-bottom:18px;
  cursor:pointer;
}
.user-avatar{
  position:relative;
  width:30px;
  height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--white);
  flex:none;
}
.user-avatar svg{width:24px;height:24px;}
.status-dot{
  position:absolute;
  bottom:-1px;
  right:-1px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  border:1.5px solid var(--sidebar-bg);
}
.user-meta{flex:1; min-width:0;}
.user-name{font-size:14px;font-weight:600;line-height:18px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:10px;font-weight:400;line-height:13px;color:var(--white);opacity:.75;}
.user-caret{width:14px;height:14px;color:var(--white);flex:none;transform:rotate(90deg);}

.quick-actions{margin-bottom:auto; flex:none;}
.quick-actions__label{
  font-size:10px;
  color:var(--white);
  opacity:.6;
  padding:0 4px;
  margin-bottom:10px;
}
.quick-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:10px 4px;
  background:transparent;
  border:1px solid var(--accent);
  border-radius:10px;
  color:var(--white);
  font-size:13px;
  font-weight:600;
  margin-bottom:10px;
  transition:background .15s ease;
}
.quick-btn:hover{background:rgba(66,64,227,.18);}
.quick-btn svg{width:24px;height:24px;flex:none;}

/* SVG quick-action buttons need the same 10px stacking rhythm as .quick-btn */
.quick-actions .nav-svg-btn{margin-bottom:10px;}
.quick-actions .nav-svg-btn:last-of-type{margin-bottom:0;}

.logout-btn-svg{
  display:block;
  width:117px;
  padding:0;
  margin:16px 0 0 3px;
  border:none;
  background:transparent;
  border-radius:10px;
  overflow:hidden;
  line-height:0;
  cursor:pointer;
  flex:none;
  transition:filter .15s ease;
}
.logout-btn-svg svg{display:block; width:100%; height:auto;}
.logout-btn-svg:hover{filter:brightness(1.3);}

/* legacy logout-btn kept for backward compatibility, unused now */
.logout-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:9px 8px;
  background:transparent;
  border:none;
  border-radius:10px;
  color:var(--white);
  font-size:13px;
  font-weight:600;
  margin-top:16px;
  width:130px;
  flex:none;
  transition:background .15s ease;
}
.logout-btn:hover{background:rgba(255,255,255,.08);}
.logout-btn svg{width:24px;height:24px;color:var(--white);}

</style>
</head>
