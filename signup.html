<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="signup page for Vita Track" />
    <title>VitaTrack - Sign Up</title>
     <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='64' height='64' rx='14' fill='%230B1727'/%3E%3Cg transform='translate(12,12)'%3E%3Crect width='17.15' height='49.96' rx='8.575' transform='matrix(0.938967 -0.344008 0.503642 0.863912 0 17.95)' fill='%234240E3'/%3E%3Crect width='16.97' height='50.7' rx='8.485' transform='matrix(0.905947 0.423391 -0.596738 0.802436 48.62 13.73)' fill='%230B1727'/%3E%3Cellipse cx='32.53' cy='7.22' rx='5.63' ry='4.82' fill='%23B8720A'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="signup-card">
        <div class="signup-header">
          <div class="title-row">
            <div>
              <h1>Create your account</h1>
              <p>Fill in the details below to get started</p>
            </div>
            <div class="header-badge">
              <span class="material-icons">account_circle</span>
            </div>
          </div>
        </div>

        <form
          class="signup-form"
          method="POST"
          onsubmit="
            event.preventDefault();
            handleSignup();
          "
        >
          <div class="field">
            <label class="field-label">Full Name</label>
            <div class="input-group">
              <span class="input-icon material-icons">person</span>
              <input
                type="text"
                placeholder="Enter your full name"
                name="name"
                required
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label">Work email address</label>
            <div class="input-group">
              <span class="input-icon material-icons">email</span>
              <input
                type="email"
                placeholder="Enter your work email"
                name="email"
                required
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label">Password</label>
            <div class="input-group">
              <span class="input-icon material-icons">lock</span>
              <input
                type="password"
                placeholder="Create a password"
                name="password"
                required
              />
              <button
                type="button"
                class="toggle-icon"
                aria-label="Show password"
              >
                <span class="material-icons">visibility</span>
              </button>
            </div>
            <p class="helper-text">
              Must be at least 8 characters with a number and symbol
            </p>
          </div>

          <div class="field">
            <label class="field-label">Confirm Password</label>
            <div class="input-group">
              <span class="input-icon material-icons">lock</span>
              <input
                type="password"
                placeholder="Confirm your password"
                name="confirmPassword"
                required
              />
              <button
                type="button"
                class="toggle-icon"
                aria-label="Show password"
              >
                <span class="material-icons">visibility</span>
              </button>
            </div>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" />
            <span
              >I agree to the <a href="#">Terms of Service</a> and
              <a href="#">Privacy Policy</a></span
            >
          </label>

          <button class="submit-btn" type="submit">Create Account</button>

          >
        </form>
      </div>
    </div>
    <script src="signup.js"></script>
  </body>
</html>
