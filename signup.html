<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="signup page for Vita Track" />
    <title>Create your account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="signup-card">
        <div class="signup-header">
          <div class="title-row">
            <div>
              <h1>Create your account</h1>
              <p>Fill in the details below to get started</p>
            </div>
            <div class="header-badge">
              <span class="material-icons">account_circle</span>
            </div>
          </div>
        </div>

        <form class="signup-form">
          <div class="field">
            <label class="field-label">Full Name</label>
            <div class="input-group">
              <span class="input-icon material-icons">person</span>
              <input type="text" placeholder="Enter your full name" />
            </div>
          </div>

          <div class="field">
            <label class="field-label">Work email address</label>
            <div class="input-group">
              <span class="input-icon material-icons">email</span>
              <input type="email" placeholder="Enter your work email" />
            </div>
          </div>

          <div class="field">
            <label class="field-label">Password</label>
            <div class="input-group">
              <span class="input-icon material-icons">lock</span>
              <input type="password" placeholder="Create a password" />
              <button
                type="button"
                class="toggle-icon"
                aria-label="Show password"
              >
                <span class="material-icons">visibility</span>
              </button>
            </div>
            <p class="helper-text">
              Must be at least 8 characters with a number and symbol
            </p>
          </div>

          <div class="field">
            <label class="field-label">Confirm Password</label>
            <div class="input-group">
              <span class="input-icon material-icons">lock</span>
              <input type="password" placeholder="Confirm your password" />
            </div>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" />
            <span
              >I agree to the <a href="#">Terms of Service</a> and
              <a href="#">Privacy Policy</a></span
            >
          </label>

          <a href="login.html" class="submit-btn" type="submit"
            >Create Account</a
          >
        </form>
      </div>
    </div>
  </body>
</html>
