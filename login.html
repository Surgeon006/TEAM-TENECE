<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="signin page for Vita Track" />
    <title>Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="login-card">
        <div class="signup-header">
          <div class="title-row">
            <div>
              <h1>Welcome back !</h1>
              <p>Sign in to your Vita Track account</p>
            </div>
          </div>
        </div>
        <form class="signup-form">
          <div class="field">
            <label class="field-label" for="email">Email Address</label>
            <div class="input-group">
              <span class="input-icon material-icons">email</span>
              <input
                id="email"
                type="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="input-group">
              <span class="input-icon material-icons">lock</span>
              <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                class="toggle-icon"
                aria-label="Show password"
              >
                <span class="material-icons">visibility</span>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-row">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="forgot-password-link">
              Forgot password?
            </a>
          </div>

          <!-- Corrected Sign In link -->
          <a href="dashboard.html" class="submit-btn">Sign In</a>
        </form>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
