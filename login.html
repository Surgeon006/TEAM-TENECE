<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="signin page for Vita Track" />
    <title>Vitatrack - Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
     <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='64' height='64' rx='14' fill='%230B1727'/%3E%3Cg transform='translate(12,12)'%3E%3Crect width='17.15' height='49.96' rx='8.575' transform='matrix(0.938967 -0.344008 0.503642 0.863912 0 17.95)' fill='%234240E3'/%3E%3Crect width='16.97' height='50.7' rx='8.485' transform='matrix(0.905947 0.423391 -0.596738 0.802436 48.62 13.73)' fill='%230B1727'/%3E%3Cellipse cx='32.53' cy='7.22' rx='5.63' ry='4.82' fill='%23B8720A'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="login-card">
        <div class="signup-header">
          <div class="title-row">
            <div>
              <h1>Welcome back !</h1>
              <p>Sign in to your Vita Track account</p>
            </div>
          </div>
        </div>
        <form class="signup-form">
          <div class="field">
            <label class="field-label" for="email">Email Address</label>
            <div class="input-group">
              <span class="input-icon material-icons">email</span>
              <input
                id="email"
                type="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="input-group">
              <span class="input-icon material-icons">lock</span>
              <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                class="toggle-icon"
                aria-label="Show password"
              >
                <span class="material-icons">visibility</span>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-row">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="forgot-password-link">
              Forgot password?
            </a>
          </div>

          <!-- Corrected Sign In link -->
          <a href="dashboard.html" class="submit-btn">Sign In</a>
        </form>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
